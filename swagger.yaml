openapi: 3.0.3
info:
  title: PingQR API
  description: PingQR API service
  version: 0.3.2

servers:
  - url: http://localhost:8080/v1
    description: Local development server
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: Instances
    description: Instance management operations
  - name: Messages
    description: Send messages operations
  - name: Webhooks
    description: Webhook configuration
  - name: System
    description: System operations

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: API key for authentication
  
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error details
        message:
          type: string
          description: Error message
        errorMessage:
          type: string
          description: Detailed error message
    
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    
    HardResetResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        error:
          type: string
          description: Error description - what happened (only present if success is false)
        message:
          type: string
          description: Root cause error message - the actual error that triggered everything (only present if success is false)
    
    CreateInstanceRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Instance ID
          example: my-instance
    
    CreateInstanceResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        error:
          type: string
          description: Error description - what happened (only present if success is false)
          example: "failed to create instance"
        message:
          type: string
          description: Root cause error message - the actual error that triggered everything (only present if success is false)
          example: "instance already exists"
    
    DeleteInstanceResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        error:
          type: string
          description: Error description - what happened (only present if success is false)
        message:
          type: string
          description: Root cause error message - the actual error that triggered everything (only present if success is false)
    
    Instance:
      type: object
      properties:
        id:
          type: string
          example: my-instance
        rejectCall:
          type: boolean
        msgCall:
          type: string
        groupsIgnore:
          type: boolean
        alwaysOnline:
          type: boolean
        readMessages:
          type: boolean
        readStatus:
          type: boolean
        syncFullHistory:
          type: boolean
        syncRecentHistory:
          type: boolean
        remoteJID:
          type: string
        webhook:
          $ref: '#/components/schemas/InstanceWebhook'
        proxyHost:
          type: string
        proxyPort:
          type: string
        proxyProtocol:
          type: string
        proxyUsername:
          type: string
        proxyPassword:
          type: string
    
    InstanceWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
        byEvents:
          type: boolean
        base64:
          type: boolean
        headers:
          type: object
          additionalProperties:
            type: string
        events:
          type: array
          items:
            type: string
    
    ConnectInstanceResponse:
      type: object
      required:
        - success
        - connected
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        qr:
          type: string
          nullable: true
          description: QR code in base64 format (without data URI prefix). Null if no QR code is available.
          example: "iVBORw0KGgoAAAANSUhEUgAA..."
        connected:
          type: boolean
          description: Whether the instance is connected
          example: false
        remoteJID:
          type: string
          nullable: true
          description: Remote JID if connected, null otherwise
          example: "1234567890@s.whatsapp.net"
    
    SendTextRequest:
      type: object
      required:
        - number
        - text
      properties:
        number:
          type: string
          description: Phone number (JID format)
          example: "1234567890@s.whatsapp.net"
        text:
          type: string
          description: Message text
          example: "Hello, this is a test message"
    
    MessageRequestQuoted:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/QuotedKey'
        message:
          $ref: '#/components/schemas/QuotedMessage'
    
    QuotedKey:
      type: object
      properties:
        id:
          type: string
          description: Message ID to quote
    
    QuotedMessage:
      type: object
      properties:
        conversation:
          type: string
          description: Quoted message text
    
    SendTextResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        error:
          type: string
          description: Error description - what happened (only present if success is false)
        message:
          type: string
          description: Root cause error message - the actual error that triggered everything (only present if success is false)
    
    MessageResponseKey:
      type: object
      properties:
        remoteJid:
          type: string
        fromMe:
          type: boolean
        id:
          type: string
    
    SendTextResponseMessage:
      type: object
      properties:
        conversation:
          type: string
    
    SendTextResponseContextInfo:
      type: object
      properties:
        participant:
          type: string
        stanzaId:
          type: string
        quotedMessage:
          $ref: '#/components/schemas/ContextInfoQuotedMessage'
    
    ContextInfoQuotedMessage:
      type: object
      properties:
        conversation:
          type: string
    
    SendAudioRequest:
      type: object
      required:
        - number
        - audio
      properties:
        number:
          type: string
          description: Phone number (JID format)
          example: "1234567890@s.whatsapp.net"
        audio:
          type: string
          format: uri
          description: URL of the MP3 audio file to send. Only MP3 format is supported.
          example: "https://example.com/audio.mp3"
    
    SendAudioResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        error:
          type: string
          description: Error description - what happened (only present if success is false)
        message:
          type: string
          description: Root cause error message - the actual error that triggered everything (only present if success is false)
    
    MessageContextInfo:
      type: object
      properties:
        messageSecret:
          type: string
        deviceListMetadata:
          $ref: '#/components/schemas/DeviceListMetadata'
        deviceListMetadataVersion:
          type: integer
    
    DeviceListMetadata:
      type: object
      properties:
        senderKeyHash:
          type: string
        senderTimestamp:
          type: string
        recipientKeyHash:
          type: string
        recipientTimestamp:
          type: string
    
    SendAudioResponseMessage:
      type: object
      properties:
        audioMessage:
          $ref: '#/components/schemas/SendAudioResponseMessageAudio'
        base64:
          type: string
    
    SendAudioResponseMessageAudio:
      type: object
      properties:
        directPath:
          type: string
        fileEncSha256:
          type: string
        fileLength:
          type: string
        fileSha256:
          type: string
        mediaKey:
          type: string
        mediaKeyTimestamp:
          type: string
        mimetype:
          type: string
        ptt:
          type: boolean
        seconds:
          type: integer
        url:
          type: string
        waveform:
          type: string
    
    SendDocumentRequest:
      type: object
      required:
        - number
        - media
      properties:
        number:
          type: string
          description: Phone number (JID format)
          example: "1234567890@s.whatsapp.net"
        caption:
          type: string
          description: Caption for the image (optional)
          example: "Check this image"
        media:
          type: string
          format: uri
          description: URL of the PNG image to send. Only PNG format is supported.
          example: "https://example.com/image.png"
    
    SendDocumentResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        error:
          type: string
          description: Error description - what happened (only present if success is false)
        message:
          type: string
          description: Root cause error message - the actual error that triggered everything (only present if success is false)
    
    SendDocumentResponseData:
      type: object
      properties:
        base64:
          type: string
          description: Base64 encoded document data
    
    UpdateHeartbeatWebhookRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Webhook URL for heartbeat and instance events
          example: https://example.com/webhook
    
    UpdateHeartbeatWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        error:
          type: string
          description: Error description - what happened (only present if success is false)
        message:
          type: string
          description: Root cause error message - the actual error that triggered everything (only present if success is false)
    
    GetHeartbeatWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        error:
          type: string
          description: Error description - what happened (only present if success is false)
        message:
          type: string
          description: Root cause error message - the actual error that triggered everything (only present if success is false)
        url:
          type: string
          format: uri
          description: Current webhook URL (only present if success is true)

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Check if the API is running and healthy
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: API is not healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reset:
    post:
      tags:
        - System
      summary: Reset
      description: Emergency endpoint that deletes all instances and clears all stored data. This will reset the API to its initial state with no data.
      responses:
        '200':
          description: Hard reset completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardResetResponse'
        '500':
          description: Error during hard reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardResetResponse'

  /instance:
    post:
      tags:
        - Instances
      summary: Create instance
      description: Create a new WhatsApp instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '201':
          description: Instance created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInstanceResponse'
              example:
                success: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInstanceResponse'
              example:
                success: false
                error: "invalid request body"
                message: "validation failed: field 'id' is required"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInstanceResponse'
              example:
                success: false
                error: "database error"
                message: "failed to create instance"

  /instance/{id}:
    post:
      tags:
        - Instances
      summary: Connect instance and get QR code
      description: Connect to a WhatsApp instance. Returns a simplified response with success status, QR code (in base64, without data URI prefix) if available, connection status, and remote JID if connected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Instance ID
          example: my-instance
      responses:
        '200':
          description: Connection response with QR code or connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectInstanceResponse'
              examples:
                withQR:
                  value:
                    success: true
                    qr: "iVBORw0KGgoAAAANSUhEUgAA..."
                    connected: false
                    remoteJID: null
                connected:
                  value:
                    success: true
                    qr: null
                    connected: true
                    remoteJID: "1234567890@s.whatsapp.net"
                error:
                  value:
                    success: false
                    qr: null
                    connected: false
                    remoteJID: null
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Instances
      summary: Delete instance
      description: Delete a WhatsApp instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Instance ID
          example: my-instance
      responses:
        '200':
          description: Instance deleted successfully or not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInstanceResponse'
              examples:
                success:
                  value:
                    success: true
                notFound:
                  value:
                    success: false
                    error: "instance not found"
                    message: "instance doesn't exists"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInstanceResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInstanceResponse'

  /instance/{instance}/message/text:
    post:
      tags:
        - Messages
      summary: Send text message
      description: Send a text message to a phone number
      parameters:
        - name: instance
          in: path
          required: true
          schema:
            type: string
          description: Instance ID
          example: my-instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTextRequest'
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTextResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTextResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTextResponse'

  /instance/{instance}/message/audio:
    post:
      tags:
        - Messages
      summary: Send audio message
      description: Send an audio message (voice note) to a phone number. Only MP3 format is supported.
      parameters:
        - name: instance
          in: path
          required: true
          schema:
            type: string
          description: Instance ID
          example: my-instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAudioRequest'
      responses:
        '200':
          description: Audio message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAudioResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAudioResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAudioResponse'

  /instance/{instance}/message/image:
    post:
      tags:
        - Messages
      summary: Send PNG image
      description: Send a PNG image to a phone number. Only PNG format is supported.
      parameters:
        - name: instance
          in: path
          required: true
          schema:
            type: string
          description: Instance ID
          example: my-instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendDocumentRequest'
            example:
              number: "1234567890@s.whatsapp.net"
              caption: "Check this image"
              media: "https://example.com/image.png"
      responses:
        '200':
          description: Image sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDocumentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDocumentResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDocumentResponse'

  /instance/{instance}/message/video:
    post:
      tags:
        - Messages
      summary: Send MP4 video
      description: Send a MP4 video to a phone number. Only MP4 format is supported.
      parameters:
        - name: instance
          in: path
          required: true
          schema:
            type: string
          description: Instance ID
          example: my-instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendDocumentRequest'
            example:
              number: "1234567890@s.whatsapp.net"
              caption: "Check this video"
              media: "https://example.com/video.mp4"
      responses:
        '200':
          description: Video sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDocumentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDocumentResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDocumentResponse'

  /webhook/heartbeat:
    get:
      tags:
        - Webhooks
      summary: Get global webhook URL
      description: Get the current global webhook URL configuration. This URL is used for both system heartbeat metrics and all instance events (incoming messages).
      responses:
        '200':
          description: Current heartbeat webhook URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHeartbeatWebhookResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHeartbeatWebhookResponse'

    put:
      tags:
        - Webhooks
      summary: Update global webhook URL
      description: Configure the global webhook URL used for both system metrics (heartbeat) and all instance events (incoming messages). This URL is shared across all instances and the heartbeat service. The webhook receives system metrics every minute and all incoming message events from all instances.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHeartbeatWebhookRequest'
      responses:
        '200':
          description: Heartbeat webhook URL updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateHeartbeatWebhookResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateHeartbeatWebhookResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateHeartbeatWebhookResponse'

